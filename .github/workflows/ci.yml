name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bayloncredit
          POSTGRES_USER: baylon
          POSTGRES_PASSWORD: baylon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baylon -d bayloncredit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://baylon:baylon@localhost:5432/bayloncredit
      TEST_DATABASE_URL: postgresql+asyncpg://baylon:baylon@localhost:5432/bayloncredit
      JWT_SECRET_KEY: ci-postgres-review-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q tests/test_credit_reviews.py

  no-duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar archivos duplicados con patron " 2."
        run: |
          matches=$(git ls-files -z | tr '\0' '\n' | grep ' 2\.' || true)
          if [ -n "$matches" ]; then
            echo "::error::Hay archivos con el patron ' 2.' en el repo:"
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "Sin archivos con el patron ' 2.'"
