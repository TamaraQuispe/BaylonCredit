name: PROY SVM x86_64

on:
  push:
    branches: [feature/proy-v6-transaccional]
    paths:
      - "deploy/verify-proy-svm-runtime.py"
      - "deploy/proy-demo/**"
      - "backend/app/ml/artifacts/credit_proy_svm_v1.joblib"
      - "entregables/PROY_Grupo2/materiales/datos/desarrollo_etiquetado.csv"
      - ".github/workflows/proy-svm-probe.yml"
  workflow_dispatch:

jobs:
  probe-x86_64:
    name: probe-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned inference stack
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy==2.5.3" \
            "scikit-learn==1.9.1" \
            "scipy==1.18.1" \
            "joblib==1.6.0" \
            "threadpoolctl==3.7.0"
      - name: Probe frozen SVM on x86_64
        run: |
          mkdir -p evidence
          python deploy/verify-proy-svm-runtime.py probe \
            --artifact backend/app/ml/artifacts/credit_proy_svm_v1.joblib \
            --development-csv entregables/PROY_Grupo2/materiales/datos/desarrollo_etiquetado.csv \
            --output-json evidence/probe-x86_64.json
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          path = Path("evidence/probe-x86_64.json")
          data = json.loads(path.read_text())
          print("machine", platform.machine())
          print("runtime", json.dumps(data["runtime"], sort_keys=True))
          print("sha256", hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: proy-svm-probe-x86_64
          path: evidence/probe-x86_64.json

  demo-image:
    name: demo-image-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned demo image
        run: docker build -f deploy/proy-demo/Dockerfile -t bayloncredit-proy-demo:x86_64 .
      - name: Confirm the runtime inside the image
        run: docker run --rm bayloncredit-proy-demo:x86_64 python check-runtime.py
