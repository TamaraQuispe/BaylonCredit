# Configuración de reverse proxy para terminar HTTP/HTTPS en un front (Caddy,
# Cloudflare, o el propio Nginx con Let's Encrypt) que conserva X-Forwarded-*.
# Sirve el SPA (dist) y reenvía /api y /health a la API del compose.
#
# La API ya escucha en el contenedor "api:8000" con --proxy-headers y
# --forwarded-allow-ips "*", así que la cadena de proxies se respeta.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cachea los assets con hash de Vite; el resto del SPA no.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El resto es la SPA: delega al index.html para las rutas del front.
    location / {
        try_files $uri $uri/ /index.html;
    }
}